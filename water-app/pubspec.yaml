name: water_app
description: Multi-vendor water bottle delivery app
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  go_router: ^13.2.5
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  # TODO: add google_maps_flutter when google-services.json is available
  # google_maps_flutter: ^2.6.1
  geolocator: ^14.0.2
  # TODO: add razorpay_flutter when platform setup is complete
  # razorpay_flutter: ^1.3.6
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  firebase_auth: ^5.1.3
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
